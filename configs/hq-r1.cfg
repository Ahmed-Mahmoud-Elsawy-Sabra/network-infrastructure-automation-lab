! HQ-R1 - Cairo
hostname HQ-R1
no ip domain-lookup
ip domain-name nilab.local
service password-encryption
enable secret CHANGE_ME_ENABLE_SECRET
username labadmin privilege 15 secret CHANGE_ME_USER_SECRET
ip ssh version 2
crypto key generate rsa modulus 2048
!
interface GigabitEthernet0/0
 description 802.1Q trunk to HQ-SW1
 no shutdown
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 description VLAN10_IT
 ip address 10.10.10.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 description VLAN20_HR
 ip address 10.10.20.1 255.255.255.0
!
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 description VLAN30_FINANCE
 ip address 10.10.30.1 255.255.255.0
!
interface GigabitEthernet0/0.99
 encapsulation dot1Q 99
 description VLAN99_MANAGEMENT
 ip address 10.10.99.1 255.255.255.0
!
interface GigabitEthernet0/1
 description WAN_to_BR-R1
 ip address 10.255.0.1 255.255.255.252
 no shutdown
!
ip dhcp excluded-address 10.10.10.1 10.10.10.20
ip dhcp excluded-address 10.10.20.1 10.10.20.20
ip dhcp excluded-address 10.10.30.1 10.10.30.20
ip dhcp excluded-address 10.10.99.1 10.10.99.20
ip dhcp pool HQ_IT
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 1.1.1.1 8.8.8.8
 domain-name nilab.local
ip dhcp pool HQ_HR
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 1.1.1.1 8.8.8.8
 domain-name nilab.local
ip dhcp pool HQ_FINANCE
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 1.1.1.1 8.8.8.8
 domain-name nilab.local
!
router ospf 10
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
