! BR-R1 - Alexandria
hostname BR-R1
no ip domain-lookup
ip domain-name nilab.local
service password-encryption
enable secret CHANGE_ME_ENABLE_SECRET
username labadmin privilege 15 secret CHANGE_ME_USER_SECRET
ip ssh version 2
crypto key generate rsa modulus 2048
!
interface GigabitEthernet0/0
 description 802.1Q trunk to BR-SW1
 no shutdown
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 description VLAN10_OPERATIONS
 ip address 10.20.10.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 description VLAN20_SALES
 ip address 10.20.20.1 255.255.255.0
!
interface GigabitEthernet0/0.99
 encapsulation dot1Q 99
 description VLAN99_MANAGEMENT
 ip address 10.20.99.1 255.255.255.0
!
interface GigabitEthernet0/1
 description WAN_to_HQ-R1
 ip address 10.255.0.2 255.255.255.252
 no shutdown
!
ip dhcp excluded-address 10.20.10.1 10.20.10.20
ip dhcp excluded-address 10.20.20.1 10.20.20.20
ip dhcp excluded-address 10.20.99.1 10.20.99.20
ip dhcp pool BRANCH_OPERATIONS
 network 10.20.10.0 255.255.255.0
 default-router 10.20.10.1
 dns-server 1.1.1.1 8.8.8.8
 domain-name nilab.local
ip dhcp pool BRANCH_SALES
 network 10.20.20.0 255.255.255.0
 default-router 10.20.20.1
 dns-server 1.1.1.1 8.8.8.8
 domain-name nilab.local
!
router ospf 10
 router-id 2.2.2.2
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.20.10.0 0.0.0.255 area 0
 network 10.20.20.0 0.0.0.255 area 0
 network 10.20.99.0 0.0.0.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
