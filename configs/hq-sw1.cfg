! HQ-SW1 - Layer 2 access switch
hostname HQ-SW1
no ip domain-lookup
vlan 10
 name IT
vlan 20
 name HR
vlan 30
 name FINANCE
vlan 99
 name MANAGEMENT
!
interface GigabitEthernet0/1
 description TRUNK_to_HQ-R1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface range FastEthernet0/1-8
 description HQ_IT_ACCESS
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface range FastEthernet0/9-12
 description HQ_HR_ACCESS
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface range FastEthernet0/13-18
 description HQ_FINANCE_ACCESS
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
!
interface Vlan99
 description SWITCH_MANAGEMENT
 ip address 10.10.99.2 255.255.255.0
 no shutdown
ip default-gateway 10.10.99.1
!
ip domain-name nilab.local
username labadmin privilege 15 secret CHANGE_ME_USER_SECRET
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
