! BR-SW1 - Layer 2 access switch
hostname BR-SW1
no ip domain-lookup
vlan 10
 name OPERATIONS
vlan 20
 name SALES
vlan 99
 name MANAGEMENT
!
interface GigabitEthernet0/1
 description TRUNK_to_BR-R1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface range FastEthernet0/1-12
 description BRANCH_OPERATIONS_ACCESS
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface range FastEthernet0/13-20
 description BRANCH_SALES_ACCESS
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface Vlan99
 description SWITCH_MANAGEMENT
 ip address 10.20.99.2 255.255.255.0
 no shutdown
ip default-gateway 10.20.99.1
!
ip domain-name nilab.local
username labadmin privilege 15 secret CHANGE_ME_USER_SECRET
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
